<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كودسيبر ︽ CODECYBER</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(10, 15, 30, 0.85);
            --cyan-glow: #00f3ff;
            --blue-team: #0066ff;
            --blue-glow: rgba(0, 102, 255, 0.6);
            --red-team: #ff0055;
            --red-glow: rgba(255, 0, 85, 0.6);
            --green-glow: #00ff66;
            --text-color: #e2e8f0;
            --border-cyan: rgba(0, 243, 255, 0.3);
            --border-red: rgba(255, 0, 85, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Segoe UI', monospace, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* الشريط العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(3, 7, 18, 0.95);
            border-bottom: 1px solid var(--border-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
        }
        
        .top-left, .top-right { display: flex; gap: 12px; align-items: center; }
        
        .cyber-btn {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--cyan-glow);
            color: var(--cyan-glow);
            padding: 6px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .cyber-btn:hover {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        /* التخطيط الرئيسي */
        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 15px;
            padding: 20px;
            max-width: 1450px;
            margin: 0 auto;
            width: 100%;
        }

        /* لوحات الفرق */
        .team-box {
            background: var(--panel-bg);
            border-radius: 6px;
            padding: 14px;
            border: 1px solid var(--border-cyan);
            margin-bottom: 12px;
            position: relative;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            backdrop-filter: blur(5px);
        }

        .team-box.blue { border-color: var(--blue-team); box-shadow: inset 0 0 15px rgba(0, 102, 255, 0.15), 0 0 10px rgba(0, 102, 255, 0.2); }
        .team-box.red { border-color: var(--red-team); box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.15), 0 0 10px rgba(255, 0, 85, 0.2); }

        .team-title {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .team-box.blue .team-title { color: #3388ff; text-shadow: 0 0 8px var(--blue-glow); }
        .team-box.red .team-title { color: #ff3377; text-shadow: 0 0 8px var(--red-glow); }

        .players-list { display: flex; gap: 10px; flex-wrap: wrap; }
        
        .cyber-avatar {
            width: 48px;
            height: 48px;
            background: #090d16;
            border: 1px solid var(--border-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #fff;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.2);
        }
        .team-box.red .cyber-avatar { border-color: var(--border-red); box-shadow: 0 0 8px rgba(255, 0, 85, 0.2); }

        /* سجل اللعبة والتلميح النشط */
        .center-panel { display: flex; flex-direction: column; gap: 12px; }

        .game-log-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-cyan);
            border-radius: 4px;
            height: 150px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #8a99ad;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
        }
        .log-title { text-align: center; color: var(--cyan-glow); font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 0 5px var(--cyan-glow); }

        .active-clue-display {
            background: rgba(0, 243, 255, 0.08);
            border: 1px solid var(--cyan-glow);
            padding: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            color: var(--cyan-glow);
            letter-spacing: 1px;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        /* شبكة الكلمات 5x5 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .card {
            aspect-ratio: 1.3;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            color: var(--text-color);
            user-select: none;
            transition: all 0.2s;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .card:hover { 
            border-color: var(--cyan-glow); 
            box-shadow: 0 0 12px var(--cyan-glow);
            transform: translateY(-2px);
        }

        /* أنماط البطاقات المنكشوفة */
        .card.revealed-blue { background: var(--blue-team) !important; color: #fff; box-shadow: 0 0 15px var(--blue-glow); border-color: #3388ff; }
        .card.revealed-red { background: var(--red-team) !important; color: #fff; box-shadow: 0 0 15px var(--red-glow); border-color: #ff3377; }
        .card.revealed-neutral { background: #475569 !important; color: #cbd5e1; }
        .card.revealed-assassin { background: #000 !important; color: var(--red-team); border: 2px solid var(--red-team); box-shadow: 0 0 20px var(--red-glow); }

        /* رؤية القائد المخفية (Spymaster View) */
        .spymaster-mode .card:not([class*="revealed-"]).spy-blue { border: 2px solid var(--blue-team); box-shadow: inset 0 0 10px rgba(0, 102, 255, 0.4); }
        .spymaster-mode .card:not([class*="revealed-"]).spy-red { border: 2px solid var(--red-team); box-shadow: inset 0 0 10px rgba(255, 0, 85, 0.4); }
        .spymaster-mode .card:not([class*="revealed-"]).spy-neutral { border: 1px dashed #64748b; }
        .spymaster-mode .card:not([class*="revealed-"]).spy-assassin { border: 2px solid #ff0055; background: rgba(255, 0, 85, 0.1); }

        /* شريط التلميح */
        .clue-bar {
            background: var(--panel-bg);
            border: 1px solid var(--border-cyan);
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .clue-input, .clue-select {
            background: #030712;
            border: 1px solid var(--border-cyan);
            color: var(--cyan-glow);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }
        .clue-input { flex: 2; }
        .clue-select { flex: 1; cursor: pointer; }

        .btn-send {
            background: rgba(0, 255, 102, 0.1);
            color: var(--green-glow);
            border: 1px solid var(--green-glow);
            padding: 10px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.2);
        }

        .btn-send:hover {
            background: var(--green-glow);
            color: #000;
            box-shadow: 0 0 15px var(--green-glow);
        }

        /* الشريط الإخباري الأسفل */
        .marquee-footer {
            width: 100%;
            background: #02040a;
            border-top: 1px solid var(--cyan-glow);
            overflow: hidden;
            white-space: nowrap;
            padding: 8px 0;
            box-shadow: 0 -5px 15px rgba(0, 243, 255, 0.1);
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
            color: var(--cyan-glow);
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--cyan-glow);
        }

        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* شاشة الدخول */
        #login-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border: 1px solid var(--cyan-glow);
            text-align: center;
            width: 340px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
    </style>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="login-modal">
        <div class="modal-content">
            <h2 style="color:var(--cyan-glow); margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan-glow);">CODECYBER ︽</h2>
            <button class="btn-send" style="width:100%; margin-bottom:12px;" onclick="initHost()">إنشاء غرفة جديدة (مضيف)</button>
            <input type="text" id="room-code-input" placeholder="رمز الغرفة..." class="clue-input" style="width:100%; margin-bottom:12px; text-align:center;">
            <button class="cyber-btn" style="width:100%; justify-content:center; padding:10px;" onclick="initClient()">الانضمام لغرفة</button>
        </div>
    </div>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <div class="top-left">
            <button class="cyber-btn"><span>👥</span> <span id="online-count">1</span></button>
            <button class="cyber-btn" onclick="toggleRole()"><span>👁️</span> <span id="role-text">وضع اللاعب</span></button>
        </div>
        <div class="top-right">
            <button class="cyber-btn">NEWS</button>
            <button class="cyber-btn">📑 RULES</button>
            <button class="cyber-btn">⚙️</button>
        </div>
    </div>

    <!-- واجهة اللعب الرئيسية -->
    <div class="main-container" id="main-container">
        
        <!-- الفريق الأزرق -->
        <div>
            <div class="team-box blue">
                <div class="team-title">OPERATIVES</div>
                <div class="players-list">
                    <div class="cyber-avatar">N</div>
                    <div class="cyber-avatar">بلو</div>
                    <div class="cyber-avatar">زوووووط</div>
                </div>
            </div>
            <div class="team-box blue">
                <div class="team-title">SPYMASTERS</div>
                <div class="players-list">
                    <div class="cyber-avatar" style="border-color:#ffd700; color:#ffd700;">👑 PUBLIC</div>
                </div>
            </div>
        </div>

        <!-- المنتصف: السجل + المستطيل النشط + الشبكة + التلميح -->
        <div class="center-panel">
            <div class="game-log-box" id="game-log">
                <div class="log-title">System // GAME LOG</div>
                <div>[النظام] جاري إعداد الاتصال بالشبكة...</div>
            </div>

            <div class="active-clue-display" id="active-clue">
                التلميح الحالي: بانتظار إرسال التلميح...
            </div>

            <div class="game-grid" id="grid"></div>

            <div class="clue-bar">
                <input type="text" id="clue-word" class="clue-input" placeholder="أدخل كلمة التلميح...">
                <!-- القائمة المنسدلة من 1 إلى 8 بالترتيب الصحيح -->
                <select id="clue-count" class="clue-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
                <button class="btn-send" onclick="sendClue()">إرسال</button>
            </div>
        </div>

        <!-- الفريق الأحمر -->
        <div>
            <div class="team-box red">
                <div class="team-title">OPERATIVES</div>
                <div class="players-list">
                    <div class="cyber-avatar">24</div>
                    <div class="cyber-avatar">D7</div>
                    <div class="cyber-avatar">SPY</div>
                </div>
            </div>
            <div class="team-box red">
                <div class="team-title">SPYMASTERS</div>
                <div class="players-list">
                    <div class="cyber-avatar">زوزو</div>
                </div>
            </div>
        </div>

    </div>

    <!-- الشريط الإخباري الأسفل -->
    <div class="marquee-footer">
        <div class="marquee-text">
            ︽ CODECYBER SYSTEM ONLINE ︽ اختر فريقك وقم بفك الشفرة بحذر ︽ تجنب البطاقة القاتلة ︽
        </div>
    </div>

    <script>
        const wordsPool = [
            "تشفير", "سيرفر", "شبكة", "معالج", "ذاكرة", 
            "قاعدة", "حماية", "كود", "برمجية", "ملف",
            "بروتوكول", "شاشة", "مفتاح", "بيانات", "نظام",
            "صمام", "قرص", "اتصال", "منفذ", "بوابة",
            "سحابي", "خوارزمية", "شفرة", "رابط", "مستكشف"
        ];

        let isSpymaster = false;
        let peer = null;
        let connections = [];
        let gameState = {
            words: [],
            types: [],
            revealed: Array(25).fill(false),
            activeClue: "بانتظار إرسال التلميح..."
        };

        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const container = document.getElementById('main-container');
            if (isSpymaster) {
                container.classList.add('spymaster-mode');
            } else {
                container.classList.remove('spymaster-mode');
            }

            for (let i = 0; i < 25; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = gameState.words[i] || `بطاقة ${i+1}`;
                
                // إضافة فئة اللون في حال كشف البطاقة
                if (gameState.revealed[i]) {
                    card.classList.add(`revealed-${gameState.types[i]}`);
                } else {
                    // إضافة التحديد للقائد فقط
                    card.classList.add(`spy-${gameState.types[i]}`);
                }

                card.onclick = () => selectCard(i);
                grid.appendChild(card);
            }

            document.getElementById('active-clue').innerText = `التلميح الحالي: ${gameState.activeClue}`;
        }

        function toggleRole() {
            isSpymaster = !isSpymaster;
            document.getElementById('role-text').innerText = isSpymaster ? "وضع القائد (Spymaster)" : "وضع اللاعب";
            initGrid();
        }

        function selectCard(index) {
            if (gameState.revealed[index]) return;
            gameState.revealed[index] = true;
            initGrid();
            
            const word = gameState.words[index];
            const type = gameState.types[index];
            addLog(`تم كشف الكلمة: ${word} (${type})`);
            
            broadcast({ type: 'STATE', state: gameState });
        }

        function addLog(msg) {
            const log = document.getElementById('game-log');
            const entry = document.createElement('div');
            entry.innerText = `> ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function sendClue() {
            const word = document.getElementById('clue-word').value.trim();
            const count = document.getElementById('clue-count').value;
            if (!word) return;

            gameState.activeClue = `${word} (${count})`;
            document.getElementById('active-clue').innerText = `التلميح الحالي: ${gameState.activeClue}`;
            
            const msg = `التلميح الجديد: ${word} | العدد المطلوب: (${count})`;
            addLog(msg);
            
            broadcast({ type: 'STATE', state: gameState });
            broadcast({ type: 'LOG', msg: msg });
            document.getElementById('clue-word').value = '';
        }

        function broadcast(data) {
            connections.forEach(conn => conn.open && conn.send(data));
        }

        function initHost() {
            document.getElementById('login-modal').style.display = 'none';
            peer = new Peer();
            
            peer.on('open', id => {
                // إنشاء خلط عشوائي للكلمات ولأنواع البطاقات
                let types = Array(8).fill('blue').concat(Array(7).fill('red'), Array(9).fill('neutral'), ['assassin']);
                types.sort(() => 0.5 - Math.random());
                
                gameState.words = [...wordsPool].sort(() => 0.5 - Math.random());
                gameState.types = types;

                addLog(`تم إنشاء الغرفة! شارك الرمز: ${id}`);
                initGrid();
            });

            peer.on('connection', conn => {
                connections.push(conn);
                conn.on('open', () => {
                    // إرسال حالة اللعبة كاملة عند دخول اللاعب فوراً
                    conn.send({ type: 'STATE', state: gameState });
                    addLog('انضم لاعب جديد للشبكة.');
                    document.getElementById('online-count').innerText = connections.length + 1;
                });
                conn.on('data', handleData);
            });
        }

        function initClient() {
            const code = document.getElementById('room-code-input').value.trim();
            if (!code) return alert('أدخل رمز الغرفة');
            
            document.getElementById('login-modal').style.display = 'none';
            peer = new Peer();
            
            peer.on('open', () => {
                const conn = peer.connect(code);
                conn.on('open', () => {
                    connections.push(conn);
                    addLog('تم الاتصال بالمضيف بنجاح.');
                });
                conn.on('data', handleData);
            });
        }

        function handleData(data) {
            if (data.type === 'STATE') {
                gameState = data.state;
                initGrid();
            } else if (data.type === 'LOG') {
                addLog(data.msg);
            }
        }
    </script>
</body>
</html>
