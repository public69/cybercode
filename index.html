<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كودسيبر ︽ CodeCyber</title>

    <!-- وسوم المعاينة والصورة المصغرة (Open Graph & Twitter) -->
    <meta property="og:title" content="كودسيبر ︽ CodeCyber">
    <meta property="og:description" content="لعبة التخمين والرموز التفاعلية السايبربنك - تحدى أصدقائك الآن!">
    <meta property="og:image" content="https://public69.github.io/cybercode/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="كودسيبر ︽ CodeCyber">
    <meta name="twitter:description" content="لعبة التخمين والرموز التفاعلية السايبربنك - تحدى أصدقائك الآن!">
    <meta name="twitter:image" content="https://public69.github.io/cybercode/preview.png">

    <!-- مكتبة PeerJS للاتصال P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --bg-color: #080b10;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --cyan-glow: #00f3ff;
            --red-glow: #ff0055;
            --blue-team: #1e90ff;
            --text-color: #e6edf3;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        /* شريط الأخبار المتحرك Ticker Bar */
        .marquee-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--cyan-glow);
            overflow: hidden;
            white-space: nowrap;
            padding: 8px 0;
            position: relative;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 25s linear infinite;
            color: var(--cyan-glow);
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* الواجهة الرئيسية */
        .container {
            width: 95%;
            max-width: 1000px;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        @media (max-width: 850px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .main-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
        }

        h1, h2, h3 {
            color: var(--cyan-glow);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
            margin-bottom: 12px;
        }

        /* شبكة اللعبة 5x5 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .card {
            aspect-ratio: 1;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            padding: 5px;
            user-select: none;
        }

        .card:hover {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }

        .card.revealed-blue { background: #1f6beb !important; color: #fff; }
        .card.revealed-red { background: #da3633 !important; color: #fff; }
        .card.revealed-neutral { background: #8b949e !important; color: #fff; }
        .card.revealed-assassin { background: #000 !important; color: var(--red-glow); border-color: var(--red-glow); }

        /* الأزرار والمدخلات */
        .btn {
            background: #21262d;
            color: var(--cyan-glow);
            border: 1px solid var(--cyan-glow);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
            margin-top: 5px;
        }

        .btn:hover {
            background: var(--cyan-glow);
            color: #000;
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        .btn-danger {
            color: var(--red-glow);
            border-color: var(--red-glow);
        }

        .btn-danger:hover {
            background: var(--red-glow);
            color: #fff;
            box-shadow: 0 0 10px var(--red-glow);
        }

        input, select {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        /* قائمة اللاعبين والأدوار الإدارية */
        .player-list {
            list-style: none;
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            color: #ffd700;
            font-size: 0.9rem;
        }

        /* سجل الأحداث */
        .game-log {
            height: 150px;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry {
            color: #8b949e;
        }

        .log-entry.blue { color: #58a6ff; }
        .log-entry.red { color: #ff7b72; }
        .log-entry.system { color: #7ee787; }
    </style>
</head>
<body>

    <!-- شريط الأخبار -->
    <div class="marquee-container">
        <div class="marquee-text">
            ︽ CODECYBER SYSTEM ONLINE ︽ نظام التشفير التفاعلي جاهز ︽ اختر فريقك وقم بفك الشفرة بحذر ︽ تجنب البطاقة القاتلة ︽
        </div>
    </div>

    <div class="container">
        <!-- اللوحة الرئيسية والشبكة -->
        <div class="main-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>كودسيبر ︽ CodeCyber</h1>
                <div id="timer-display" style="font-family: monospace; font-size: 1.2rem; color: var(--cyan-glow);">--:--</div>
            </div>

            <!-- شبكة البطاقات 5x5 -->
            <div class="game-grid" id="grid">
                <!-- يتم إنشاؤها عبر JavaScript -->
            </div>

            <!-- أدوات إعطاء التلميح -->
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <input type="text" id="clue-word" placeholder="كلمة التلميح..." style="flex: 2;">
                <select id="clue-count" style="flex: 1;">
                    <option value="1">1 (+1)</option>
                    <option value="2">2 (+1)</option>
                    <option value="3">3 (+1)</option>
                    <option value="4">4 (+1)</option>
                    <option value="5">5 (+1)</option>
                </select>
                <button class="btn" style="flex: 1; margin-top: 0;" onclick="sendClue()">إرسال</button>
            </div>
        </div>

        <!-- القائمة الجانبية والإدارة -->
        <div class="sidebar">
            <!-- الاتصال والغرف -->
            <div class="panel-box">
                <h3>الغرفة والاتصال</h3>
                <button class="btn" onclick="createRoom()">إنشاء غرفة جديدة</button>
                <div style="margin-top: 8px;">
                    <input type="text" id="join-id" placeholder="رمز الغرفة للإنضمام...">
                    <button class="btn" onclick="joinRoom()">إنضمام</button>
                </div>
                <div id="room-status" style="margin-top: 8px; font-size: 0.8rem; color: #7ee787;">غير متصل</div>
            </div>

            <!-- قائمة المتواجدين والإدارة -->
            <div class="panel-box">
                <h3>اللاعبين الأدمن <span id="admin-badge" class="badge"></span></h3>
                <ul class="player-list" id="player-list">
                    <li class="player-item">
                        <div class="player-info">
                            <span class="badge">⭐️</span>
                            <span>اللاعب (أنت)</span>
                        </div>
                        <span style="font-size: 0.8rem; color: var(--cyan-glow);">القائد</span>
                    </li>
                </ul>
            </div>

            <!-- سجل الأحداث -->
            <div class="panel-box">
                <h3>سجل الأحداث</h3>
                <div class="game-log" id="game-log">
                    <div class="log-entry system">[النظام] مرحباً بك في لعبة كودسيبر!</div>
                </div>
            </div>

            <!-- إعدادات الإدارة (المضيف) -->
            <div class="panel-box" id="admin-controls">
                <h3>إعدادات التحكم</h3>
                <select id="timer-select">
                    <option value="none">بدون مؤقت</option>
                    <option value="90">90 ثانية</option>
                    <option value="150">150 ثانية</option>
                    <option value="240">240 ثانية</option>
                </select>
                <button class="btn btn-danger" onclick="toggleLockRoom()">قفل / فتح الغرفة</button>
            </div>
        </div>
    </div>

    <script>
        // التهيئة الأساسية للعبة
        const wordsList = [
            "تشفير", "سيرفر", "شبكة", "معالج", "ذاكرة", 
            "قاعدة", "حماية", "كود", "برمجية", "ملف",
            "بروتوكول", "شاشة", "مفتاح", "بيانات", "نظام",
            "صمام", "قرص", "اتصال", "منفذ", "بوابة",
            "سحابي", "خوارزمية", "شفرة", "رابط", "مستكشف"
        ];

        let peer = new Peer();
        let currentRoomId = null;

        // بناء الشبكة 5x5 عند التشغيل
        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = wordsList[i] || `رمز ${i+1}`;
                card.onclick = () => selectCard(card, i);
                grid.appendChild(card);
            }
        }

        function selectCard(card, index) {
            addLog(`تم النقر على البطاقة: ${card.innerText}`, 'blue');
            card.classList.add('revealed-blue');
        }

        function addLog(msg, type = 'system') {
            const log = document.getElementById('game-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString('ar-SA')}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function createRoom() {
            peer = new Peer();
            peer.on('open', (id) => {
                currentRoomId = id;
                document.getElementById('room-status').innerText = 'تم إنشاء الغرفة: ' + id;
                addLog(`تم إنشاء الغرفة برمز: ${id}`, 'system');
            });
        }

        function joinRoom() {
            const targetId = document.getElementById('join-id').value;
            if (!targetId) return alert('يرجى إدخال رمز الغرفة');
            const conn = peer.connect(targetId);
            conn.on('open', () => {
                document.getElementById('room-status').innerText = 'متصل بالغرفة: ' + targetId;
                addLog(`تم الإنضمام بنجاح للغرفة ${targetId}`, 'system');
            });
        }

        function sendClue() {
            const word = document.getElementById('clue-word').value;
            const count = document.getElementById('clue-count').value;
            if (!word) return;
            addLog(`التلميح: ${word} (${count} + 1)`, 'system');
            document.getElementById('clue-word').value = '';
        }

        function toggleLockRoom() {
            addLog('تم تغيير حالة قفل الغرفة من قبل المضيف', 'red');
        }

        // تشغيل اللعبة عند التحميل
        window.onload = initGrid;
    </script>
</body>
</html>
